{{- if .Values.oidc.enabled }}
{{- $hostname := first .Values.route.hostnames }}
# Requires an OIDC login for /webauth/login, plus the callback and logout paths
# the OIDC filter handles itself. Gateway API prefers these exact and longer
# matches over the main route's "/" prefix.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "semantic-search.fullname" . }}-login
  labels:
    {{- include "semantic-search.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ include "semantic-search.fullname" . }}
  hostnames:
    {{- toYaml .Values.route.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /webauth/login
      filters:
        # Only requests that passed the OIDC filter reach this rule. set
        # replaces any value the client sent.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: {{ include "semantic-search.authenticatedHeader" . }}
                value: "true"
      backendRefs:
        - kind: Service
          name: {{ include "semantic-search.fullname" . }}
          port: {{ .Values.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /webauth/oidc/
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - {{ include "semantic-search.authenticatedHeader" . }}
      backendRefs:
        - kind: Service
          name: {{ include "semantic-search.fullname" . }}
          port: {{ .Values.service.port }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "semantic-search.fullname" . }}-login
  labels:
    {{- include "semantic-search.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "semantic-search.fullname" . }}-login
  oidc:
    provider:
      issuer: {{ .Values.oidc.issuer | quote }}
    clientID: {{ .Values.oidc.clientID | quote }}
    clientSecret:
      name: {{ .Values.oidc.clientSecretName }}
    scopes:
      {{- toYaml .Values.oidc.scopes | nindent 6 }}
    # Register this redirect URL with the provider.
    redirectURL: https://{{ $hostname }}/webauth/oidc/callback
    # Must match Authentication::OIDC_LOGOUT_PATH in the app, which
    # /webauth/logout redirects to.
    logoutPath: /webauth/oidc/logout
{{- end }}
